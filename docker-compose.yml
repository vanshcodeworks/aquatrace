# AquaTrace — optional container setup.
#
# The app is fully offline and designed to run without Docker, but this file
# lets you bring both services up with a single command:
#
#   docker compose up --build
#
# Dashboard: http://localhost:5173   API docs: http://localhost:8000/docs

services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      AQUATRACE_DB: /app/backend/aquatrace.db
      AQUATRACE_COST_PER_KL: "150"
      AQUATRACE_CURRENCY: "₹"
    ports:
      - "8000:8000"

  web:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
